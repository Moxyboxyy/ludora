[package]
name = "ludora"
version = "0.8.9"
description = "Ludora – the Client for all Game Clients"
authors = ["Moxyboxyy"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "ludora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "fs", "sync"] }
dirs = "5"
anyhow = "1"
once_cell = "1"
parking_lot = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
unicode-normalization = "0.1"
futures = "0.3"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots", "gzip", "cookies", "multipart"] }
rusqlite = { version = "0.32", features = ["bundled"] }
flate2 = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
aes-gcm = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
hex = "0.4"
ed25519-dalek = "2"
png = "0.17"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
tauri-plugin-autostart = "2"
scrypt = { version = "0.11", default-features = false }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots", "rustls-tls-native-roots"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
# Sprungliste der Taskleiste (Rechtsklick auf das Ludora-Symbol: „Ludora beenden“)
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_EnhancedStorage"] }
tauri-winrt-notification = "0.8"
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_UI_Shell", "Win32_System_Com", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[profile.release]
# Klein und sparsam (panic bleibt "unwind": ein Fehler in einer Hintergrundaufgabe beendet nicht die ganze App)
codegen-units = 1
lto = true
opt-level = "s"
strip = true
