<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ludora</title>
    <link rel="icon" type="image/svg+xml" href="/src/assets/logo.svg" />
    <style>
      html, body { background: #0f1115; }
      /* Logo-Animation beim Neuladen: im Fenster über der Oberfläche (beim Programmstart läuft sie als eigenes Fenster) */
      #reload-splash { position: fixed; inset: 0; z-index: 9999; background: #0f1115; display: flex; align-items: center; justify-content: center; transition: opacity .28s ease; }
      #reload-splash.out { opacity: 0; pointer-events: none; }
      #reload-splash iframe { width: 240px; height: 240px; border: 0; background: transparent; color-scheme: normal; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      try {
        if (sessionStorage.getItem('ludora.reload') === '1' && !location.hash) {
          sessionStorage.removeItem('ludora.reload');
          window.__reloadT = performance.now();
          const d = document.createElement('div');
          d.id = 'reload-splash';
          d.innerHTML = '<iframe src="splash.html" title="" allowtransparency="true"></iframe>';
          document.body.appendChild(d);
        }
      } catch (e) { /* egal */ }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
