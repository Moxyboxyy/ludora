# Baut die Installer für Windows, macOS und Linux auf GitHub und veröffentlicht sie als Release.
# Auslöser: neue Version in package.json auf main (z. B. "version": "0.4.1"), ein Tag "v*"
# oder manuell unter "Actions → Release → Run workflow". Das Release heißt dann v<version>.
name: Release

on:
  push:
    branches: [main]
    paths: ['package.json', '.github/release-notes.md']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# Öffentliche Adresse und öffentlicher (publishable) Schlüssel des Ludora-Servers.
# Beide stecken ohnehin in jedem Installer und dürfen öffentlich sein – geschützt wird über die
# Regeln in der Datenbank. Eigener Server? Repository-Secrets HUB_URL / HUB_KEY setzen, die haben Vorrang.
env:
  HUB_URL: ${{ secrets.HUB_URL || 'https://cnnbvlxshzzrwzewepmg.supabase.co' }}
  HUB_KEY: ${{ secrets.HUB_KEY || 'sb_publishable_eR2iqOG-T5NiuOXWOCSs0A_v9SVC6-c' }}
  HUB_FUNCTION: ${{ secrets.HUB_FUNCTION || 'super-worker' }}

jobs:
  # Ab 0.8.0: Ludora ist eine Rust-App (Tauri). Dateinamen bleiben wie bei der Electron-Version,
  # damit auch der alte Updater (0.7.x) die passende Datei findet.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: win
            bundles: nsis
          - os: macos-15
            name: mac-arm64
            target: aarch64-apple-darwin
            arch: arm64
            bundles: app,dmg
          - os: macos-15
            name: mac-x64
            target: x86_64-apple-darwin
            arch: x64
            bundles: app,dmg
          - os: ubuntu-22.04
            name: linux
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}
      - name: Linux-Pakete für WebKitGTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev xdg-utils
      - run: npm ci
      - run: npm run test:js
        if: runner.os == 'Linux'
      - name: Server-Konfiguration schreiben
        shell: bash
        run: |
          printf '{ "url": "%s", "anonKey": "%s", "linkFunction": "%s" }\n' "$HUB_URL" "$HUB_KEY" "$HUB_FUNCTION" > electron/hub-config.json
      - run: cargo test --manifest-path src-tauri/Cargo.toml --release
        if: runner.os == 'Linux'
      - name: App bauen
        shell: bash
        run: npx tauri build --bundles ${{ matrix.bundles }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - name: Dateien einsammeln
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          mkdir -p out
          base=src-tauri/target/${{ matrix.target }}/release/bundle
          [ -d "$base" ] || base=src-tauri/target/release/bundle
          case "${{ matrix.name }}" in
            win)
              cp "$(ls $base/nsis/*-setup.exe | head -1)" "out/Ludora-Setup-$v.exe" ;;
            mac-*)
              ditto -c -k --keepParent "$base/macos/Ludora.app" "out/Ludora-$v-${{ matrix.arch }}.zip"
              cp "$(ls $base/dmg/*.dmg | head -1)" "out/Ludora-$v-${{ matrix.arch }}.dmg" ;;
            linux)
              cp "$(ls $base/deb/*.deb | head -1)" "out/ludora_${v}_amd64.deb"
              cp "$(ls $base/appimage/*.AppImage | head -1)" "out/Ludora-$v-x86_64.AppImage" ;;
          esac
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  # Veröffentlichen, auch wenn ein System (z. B. Mac – dort gibt es bei GitHub manchmal keine freien Rechner)
  # ausfällt; dessen Installer fehlt dann im Release und kann später nachgereicht werden.
  # Versionen mit Bindestrich (z. B. 0.8.0-beta.1) werden Vorabversionen: der Updater bietet sie nicht an.
  release:
    needs: build
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version lesen
        id: version
        run: |
          v=$(node -p "require('./package.json').version")
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          case "$v" in *-*) echo "pre=true" >> "$GITHUB_OUTPUT";; *) echo "pre=false" >> "$GITHUB_OUTPUT";; esac
      - uses: actions/download-artifact@v4
        with:
          path: dist-all
          merge-multiple: true
      - run: ls -la dist-all
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Ludora ${{ github.ref_type == 'tag' && github.ref_name || steps.version.outputs.tag }}
          prerelease: ${{ steps.version.outputs.pre == 'true' }}
          make_latest: ${{ steps.version.outputs.pre != 'true' }}
          body_path: .github/release-notes.md
          files: dist-all/*
